name: ➕ Add a project
description: Suggest an open-source trading bot to add to the list
labels: ["new-entry"]
body:
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository URL
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: One-line description
    validations:
      required: true
